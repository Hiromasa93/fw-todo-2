<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="controls">
    <div id="keyboard-shortcuts" th:data-api-url="@{/api/shortcuts}"
         th:data-new-url="@{/todos/new}" th:data-search-url="@{/todos(focus='search')}">
        <button class="btn sub" type="button" data-shortcut-help aria-haspopup="dialog">ショートカット（?）</button>
        <dialog id="shortcut-help" aria-labelledby="shortcut-help-title">
            <h2 id="shortcut-help-title">キーボードショートカット</h2>
            <p>入力欄・選択欄・編集可能な領域ではEscape以外は無効です。Escapeで入力欄からフォーカスを外せます。</p>
            <p data-shortcut-status role="status"></p>
            <ul data-shortcut-list></ul>
            <button class="btn" type="button" data-shortcut-close autofocus>閉じる（Escape）</button>
        </dialog>
    </div>
    <script th:src="@{/js/shortcuts.js}" defer></script>
</th:block>
</body>
</html>
