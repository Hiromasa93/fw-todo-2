<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タスクの詳細</title>
    <th:block th:replace="~{fragments/theme :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/theme :: controls}"></div>
    <main class="container">
        <h1 class="page-title">タスクの詳細</h1>
        <dl>
            <dt>やること</dt><dd th:text="${todo.title}"></dd>
            <dt>メモ</dt><dd th:text="${#strings.isEmpty(todo.detail) ? '（なし）' : todo.detail}"></dd>
            <dt>ジャンル</dt><dd th:text="${todo.category}"></dd>
            <dt>優先度</dt><dd th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}"></dd>
            <dt>期限</dt><dd th:text="${todo.dueDate == null ? '期限なし' : #temporals.format(todo.dueDate, 'yyyy/MM/dd')}"></dd>
            <dt>状態</dt><dd th:text="${todo.completed == true ? '完了' : '未完了'}"></dd>
        </dl>
        <div th:replace="~{fragments/tags :: summary}"></div>
        <a class="btn" th:if="${todo.deletedAt == null}" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a>
        <a class="btn sub" th:href="${todo.deletedAt == null} ? @{/todos} : @{/todos(trash=1)}">一覧へ</a>
    </main>
    <th:block th:replace="~{fragments/shortcuts :: controls}"></th:block>
</body>
</html>
