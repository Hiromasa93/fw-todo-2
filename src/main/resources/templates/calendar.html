<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カレンダー</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container calendar-page">
    <h1 class="page-title" th:text="${year + '年' + month + '月'}">2026年4月</h1>

    <nav class="calendar-navigation" aria-label="月の移動">
        <div class="calendar-navigation-months">
            <a class="link" th:href="@{/calendar(year=${previousYear}, month=${previousMonth})}">前の月</a>
            <a class="link" th:href="@{/calendar(year=${nextYear}, month=${nextMonth})}">次の月</a>
        </div>
        <div class="calendar-navigation-pages">
            <a class="link" href="/todos">表で見る</a>
            <a class="link" href="/todos/new">新規登録</a>
        </div>
    </nav>

    <table class="calendar-table" th:attr="data-from=${from}, data-to=${to}">
        <thead>
        <tr>
            <th scope="col">日</th>
            <th scope="col">月</th>
            <th scope="col">火</th>
            <th scope="col">水</th>
            <th scope="col">木</th>
            <th scope="col">金</th>
            <th scope="col">土</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="week : ${weeks}">
            <td th:each="date : ${week}" th:attr="data-date=${date != null ? #temporals.format(date, 'yyyy-MM-dd') : null}">
                <span th:if="${date != null}" th:text="${date.dayOfMonth}">1</span>
            </td>
        </tr>
        </tbody>
    </table>
    <p>天気予報：東京（都心）、今日から16日分のうち取得できた日のみ表示。提供：<a class="link" href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a></p>
</main>
<script>
    async function showTodosInCalendar() {
        const calendar = document.querySelector('.calendar-table');
        const from = calendar.dataset.from;
        const to = calendar.dataset.to;
        const params = new URLSearchParams({ from, to });
        const res = await fetch(`/api/todos?${params}`);
        const todos = await res.json();

        const today = new Date();
        const todayDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        const todosByDate = new Map();
        todos.forEach(todo => {
            if (!todosByDate.has(todo.dueDate)) todosByDate.set(todo.dueDate, []);
            todosByDate.get(todo.dueDate).push(todo);
        });

        document.querySelectorAll('.calendar-table td[data-date]').forEach(cell => {
            const dayTodos = todosByDate.get(cell.dataset.date) || [];
            dayTodos.slice(0, 3).forEach(todo => {
                const title = document.createElement('a');
                title.href = `/todos/${todo.id}/edit`;
                title.classList.add('link');
                title.textContent = todo.title;
                if (todo.dueDate < todayDate && !todo.completed) {
                    title.classList.add('overdue');
                }
                cell.appendChild(title);
            });
            if (dayTodos.length > 3) {
                const more = document.createElement('div');
                more.textContent = `ほか ${dayTodos.length - 3}件`;
                cell.appendChild(more);
            }
        });

        const holidaysRes = await fetch(`/api/holidays?${params}`);
        const holidays = await holidaysRes.json();
        if (holidaysRes.headers.has('X-Holidays-Unavailable')) {
            const message = document.createElement('p');
            message.textContent = '祝日を取れませんでした';
            document.querySelector('main').prepend(message);
        }

        document.querySelectorAll('.calendar-table td[data-date]').forEach(cell => {
            const date = new Date(`${cell.dataset.date}T00:00:00`);
            const day = date.getDay();
            if (day === 6) cell.classList.add('saturday');
            if (day === 0) cell.classList.add('sunday');
            if (Object.hasOwn(holidays, cell.dataset.date)) {
                cell.classList.add('holiday');
                cell.title = holidays[cell.dataset.date];
            }
        });
    }

    async function showWeatherInCalendar() {
        const calendar = document.querySelector('.calendar-table');
        const params = new URLSearchParams({ from: calendar.dataset.from, to: calendar.dataset.to });
        try {
            const response = await fetch(`/api/weather?${params}`, { signal: AbortSignal.timeout(10000) });
            if (!response.ok || response.headers.has('X-Weather-Unavailable')) return;
            const weather = await response.json();
            document.querySelectorAll('.calendar-table td[data-date]').forEach(cell => {
                const description = weather[cell.dataset.date];
                if (typeof description !== 'string' || !description) return;
                const label = document.createElement('div');
                label.textContent = `天気：${description}`;
                cell.appendChild(label);
            });
        } catch (error) {
            // Weather is optional; keep the calendar and todos visible when unavailable.
        }
    }

    showTodosInCalendar();
    showWeatherInCalendar();
</script>
</body>
</html>
