<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <meta name="_csrf_parameter" th:if="${_csrf != null}" th:content="${_csrf.parameterName}">
    <th:block th:replace="~{fragments/theme :: head}"></th:block>
    <link rel="stylesheet" href="/css/style.css">
    <script th:src="@{/js/quick-input.js}" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1 class="page-title" th:text="${trash} ? '削除したもの' : 'やること一覧'">やること一覧</h1>
            <div th:replace="~{fragments/theme :: controls}"></div>
        </header>
        <th:block th:if="${!trash}"><section th:replace="~{fragments/quick-input :: bar}"></section></th:block>
        <p class="flash" role="status" th:if="${message}" th:text="${message}"></p>
        <form class="search-bar" action="/todos" method="get">
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="trash" th:if="${trash}" value="1">
            <input class="form-input" type="text" name="keyword" data-shortcut-search aria-label="タスク検索" placeholder="やることの名前" th:value="${keyword}">
            <select class="form-input" name="category">
                <option value="未分類" th:selected="${category == '未分類'}">未分類</option>
                <option value="" th:selected="${category == '' or category == 'すべて'}">すべて</option>
                <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                <option value="資格" th:selected="${category == '資格'}">資格</option>
                <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
            </select>
            <label><input type="checkbox" name="includeCompleted" value="true" th:checked="${includeCompleted}"> 完了したものも表示する</label>
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc',includeCompleted=${includeCompleted},trash=${trash ? '1' : null})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc',includeCompleted=${includeCompleted},trash=${trash ? '1' : null})}">期限が遠い順</a>
        </form>
        <p><a class="btn" th:href="@{/api/todos.csv(keyword=${keyword},category=${category},order=${order},includeCompleted=${includeCompleted},trash=${trash ? '1' : null})}">CSVを書き出す</a></p>
        <p><a class="btn" th:if="${!trash}" href="/todos/new">新規登録</a> <a class="link" th:if="${!trash}" href="/calendar">カレンダーで見る</a> <a class="link" th:if="${!trash}" href="/todos?trash=1">削除したものを見る</a> <a class="link" th:if="${trash}" href="/todos">一覧に戻る</a></p>
        <p data-empty-todos th:if="${#lists.isEmpty(todos)}" th:text="${trash} ? '削除したものはありません' : 'まだ1件も登録されていません'">まだ1件も登録されていません</p>
        <div class="view-switcher" role="group" aria-label="タスクの表示モード" data-view-switcher>
            <button type="button" class="view-switcher-button" data-view="list" aria-pressed="false">リスト</button>
            <button type="button" class="view-switcher-button" data-view="grid" aria-pressed="false">グリッド</button>
            <button type="button" class="view-switcher-button" data-view="table" aria-pressed="true">テーブル</button>
        </div>
        <form id="bulk-delete-form" th:if="${!trash}" th:hidden="${#lists.isEmpty(todos)}" th:action="@{/todos/bulk-delete}" method="post">
            <input type="hidden" name="keyword" th:value="${keyword}">
            <input type="hidden" name="category" th:value="${category}">
            <input type="hidden" name="order" th:value="${order}">
            <input type="hidden" name="includeCompleted" th:value="${includeCompleted}">
            <input type="hidden" name="page" th:value="${currentPage}">
            <div class="bulk-actions" role="group" aria-label="選択した項目の操作">
                <span id="selection-count" role="status" aria-live="polite" aria-atomic="true">0件選択中</span>
                <button class="btn bulk-action" type="submit" name="completed" value="true"
                        th:formaction="@{/todos/bulk-status}" disabled>完了にする</button>
                <button class="btn sub bulk-action" type="submit" name="completed" value="false"
                        th:formaction="@{/todos/bulk-status}" disabled>未完了に戻す</button>
                <button class="btn sub bulk-action" id="bulk-delete-button" type="submit" disabled>選択した項目を削除</button>
            </div>
            <p>全選択は表示中のページが対象です。</p>
        </form>
        <table class="todo-table view-table" data-todo-views th:hidden="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th th:if="${!trash}"><label><input id="select-all" type="checkbox"> 全選択</label></th>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}" tabindex="0" data-shortcut-task
                    th:attr="data-due-date=${todo.dueDate},data-completed=${todo.completed}">
                    <td th:if="${!trash}">
                        <input class="todo-select" type="checkbox" name="ids" th:value="${todo.id}"
                               form="bulk-delete-form" th:attr="aria-label=${todo.title + 'を選択'}">
                    </td>
                    <td>
                        <div class="todo-title">
                            <form class="pin-form" th:if="${!trash}" th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post">
                                <input type="hidden" name="keyword" th:value="${keyword}">
                                <input type="hidden" name="category" th:value="${category}">
                                <input type="hidden" name="order" th:value="${order}">
                                <input type="hidden" name="includeCompleted" th:value="${includeCompleted}">
                                <input type="hidden" name="page" th:value="${currentPage}">
                                <button class="pin-button" type="submit"
                                        th:classappend="${todo.pinned} ? 'is-pinned'"
                                        th:attr="aria-label=${todo.pinned} ? '印を外す' : '印を付ける',aria-pressed=${todo.pinned}"
                                        th:title="${todo.pinned} ? '印を外す' : '印を付ける'">
                                    <span aria-hidden="true" th:text="${todo.pinned} ? '★' : '☆'">☆</span>
                                </button>
                            </form>
                            <span th:if="${trash and todo.pinned}" class="pin-mark" aria-label="印あり">★</span>
                            <a class="link" data-shortcut-detail th:href="@{/todos/{id}(id=${todo.id})}" th:text="${todo.title}">やること</a>
                        </div>
                    </td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td>
                        <span th:if="${todo.priority == 1}" class="priority-high-mark" aria-hidden="true"></span>
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span>
                    </td>
                    <td th:text="${todo.dueDate != null ? #temporals.format(todo.dueDate, 'yyyy/MM/dd') : '期限なし'}">期限</td>
                    <td>
                        <span th:text="${todo.completed ? '完了' : '未完了'}">状態</span>
                        <span th:if="${todo.completed and todo.completedAt != null}"
                              th:text="${#temporals.format(todo.completedAt, 'yyyy/MM/dd')}">2026/04/05</span>
                    </td>
                    <td th:if="${!trash}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td th:if="${trash}"><form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post"><button class="btn sub" type="submit">戻す</button></form></td>
                </tr>
            </tbody>
        </table>
        <nav aria-label="一覧のページ" th:unless="${#lists.isEmpty(todos)}">
            <span th:each="number : ${#numbers.sequence(1, totalPages)}">
                <strong th:if="${number == currentPage}" aria-current="page" th:text="${number}">1</strong>
                <a class="link" th:unless="${number == currentPage}"
                   th:href="@{/todos(page=${number},keyword=${keyword},category=${category},order=${order},includeCompleted=${includeCompleted},trash=${trash ? '1' : null})}"
                   th:text="${number}">2</a>
            </span>
        </nav>
    </main>
    <script>
        (() => {
            const storageKey = 'todo-list-view';
            const validViews = ['list', 'grid', 'table'];
            const table = document.querySelector('[data-todo-views]');
            const buttons = document.querySelectorAll('[data-view-switcher] [data-view]');
            if (!table || !buttons.length) return;
            const applyView = (view, persist = false) => {
                const selected = validViews.includes(view) ? view : 'table';
                table.classList.remove(...validViews.map(name => `view-${name}`));
                table.classList.add(`view-${selected}`);
                buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === selected)));
                if (persist) {
                    try { localStorage.setItem(storageKey, selected); } catch (error) { /* storage may be disabled */ }
                }
            };
            let savedView = 'table';
            try { savedView = localStorage.getItem(storageKey) || savedView; } catch (error) { /* storage may be disabled */ }
            applyView(savedView);
            buttons.forEach(button => button.addEventListener('click', () => applyView(button.dataset.view, true)));
        })();

        const bulkDeleteForm = document.getElementById('bulk-delete-form');
        if (bulkDeleteForm) {
            const selectAll = document.getElementById('select-all');
            const checkboxes = () => Array.from(document.querySelectorAll('.todo-select'));
            const actionButtons = bulkDeleteForm.querySelectorAll('.bulk-action');
            const selectionCount = document.getElementById('selection-count');
            const updateSelection = () => {
                const count = checkboxes().filter(checkbox => checkbox.checked).length;
                selectAll.checked = count === checkboxes().length && count > 0;
                selectAll.indeterminate = count > 0 && count < checkboxes().length;
                actionButtons.forEach(button => { button.disabled = count === 0; });
                selectionCount.textContent = `${count}件選択中`;
            };
            selectAll.addEventListener('change', () => {
                checkboxes().forEach(checkbox => { checkbox.checked = selectAll.checked; });
                updateSelection();
            });
            document.addEventListener('change', event => {
                if (event.target.matches('.todo-select')) updateSelection();
            });
            document.addEventListener('todo:added', updateSelection);
            window.addEventListener('pageshow', updateSelection);
            bulkDeleteForm.addEventListener('submit', event => {
                const count = checkboxes().filter(checkbox => checkbox.checked).length;
                const deleting = !event.submitter || event.submitter.id === 'bulk-delete-button';
                if (count === 0 || (deleting && !window.confirm(`選択した${count}件を削除しますか？`))) {
                    event.preventDefault();
                }
            });
            updateSelection();
        }

        const flashMessage = document.querySelector('.flash');
        if (flashMessage) {
            window.setTimeout(() => flashMessage.remove(), 5000);
        }

        const today = new Date();
        const todayDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        document.querySelectorAll('.todo-table tbody tr').forEach(row => {
            const dueDate = row.dataset.dueDate;
            const completed = row.dataset.completed === 'true';
            if (dueDate && dueDate < todayDate && !completed) {
                row.classList.add('overdue');
            }
        });
    </script>
    <th:block th:replace="~{fragments/shortcuts :: controls}"></th:block>
</body>
</html>
