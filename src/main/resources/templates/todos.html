<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>やること一覧</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="container">
        <h1 class="page-title" th:text="${trash} ? '削除したもの' : 'やること一覧'">やること一覧</h1>
        <p class="flash" th:if="${message}" th:text="${message}"></p>
        <form class="search-bar" action="/todos" method="get">
            <input type="hidden" name="order" th:value="${order}">
            <input class="form-input" type="text" name="keyword" placeholder="やることの名前" th:value="${keyword}">
            <select class="form-input" name="category">
                <option value="" th:selected="${category == '' or category == 'すべて'}">すべて</option>
                <option value="デザイン" th:selected="${category == 'デザイン'}">デザイン</option>
                <option value="マーケティング" th:selected="${category == 'マーケティング'}">マーケティング</option>
                <option value="プログラミング" th:selected="${category == 'プログラミング'}">プログラミング</option>
                <option value="資格" th:selected="${category == '資格'}">資格</option>
                <option value="就職活動" th:selected="${category == '就職活動'}">就職活動</option>
            </select>
            <label><input type="checkbox" name="includeCompleted" value="true" th:checked="${includeCompleted}"> 完了したものも表示する</label>
            <button class="btn" type="submit">絞り込む</button>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='asc',includeCompleted=${includeCompleted})}">期限が近い順</a>
            <a class="link" th:href="@{/todos(keyword=${keyword},category=${category},order='desc',includeCompleted=${includeCompleted})}">期限が遠い順</a>
        </form>
        <p><a class="btn" th:if="${!trash}" href="/todos/new">新規登録</a> <a class="link" th:if="${!trash}" href="/calendar">カレンダーで見る</a> <a class="link" th:if="${!trash}" href="/todos?trash=1">削除したものを見る</a> <a class="link" th:if="${trash}" href="/todos">一覧に戻る</a></p>
        <p th:if="${#lists.isEmpty(todos)}" th:text="${trash} ? '削除したものはありません' : 'まだ1件も登録されていません'">まだ1件も登録されていません</p>
        <table class="todo-table" th:unless="${#lists.isEmpty(todos)}">
            <thead>
                <tr>
                    <th>やること</th>
                    <th>ジャンル</th>
                    <th>優先度</th>
                    <th>期限</th>
                    <th>状態</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="todo : ${todos}"
                    th:attr="data-due-date=${todo.dueDate},data-completed=${todo.completed}">
                    <td>
                        <div class="todo-title">
                            <form class="pin-form" th:if="${!trash}" th:action="@{/todos/{id}/pin(id=${todo.id})}" method="post">
                                <input type="hidden" name="keyword" th:value="${keyword}">
                                <input type="hidden" name="category" th:value="${category}">
                                <input type="hidden" name="order" th:value="${order}">
                                <input type="hidden" name="includeCompleted" th:value="${includeCompleted}">
                                <button class="pin-button" type="submit"
                                        th:classappend="${todo.pinned} ? 'is-pinned'"
                                        th:attr="aria-label=${todo.pinned} ? '印を外す' : '印を付ける',aria-pressed=${todo.pinned}"
                                        th:title="${todo.pinned} ? '印を外す' : '印を付ける'">
                                    <span aria-hidden="true" th:text="${todo.pinned} ? '★' : '☆'">☆</span>
                                </button>
                            </form>
                            <span th:if="${trash and todo.pinned}" class="pin-mark" aria-label="印あり">★</span>
                            <span th:text="${todo.title}">やること</span>
                        </div>
                    </td>
                    <td th:text="${todo.category}">ジャンル</td>
                    <td>
                        <span th:if="${todo.priority == 1}" class="priority-high-mark" aria-hidden="true"></span>
                        <span th:text="${todo.priority == 1 ? '高' : (todo.priority == 2 ? '中' : '低')}">優先度</span>
                    </td>
                    <td th:text="${todo.dueDate != null ? #temporals.format(todo.dueDate, 'yyyy/MM/dd') : '期限なし'}">期限</td>
                    <td th:text="${todo.completed ? '完了' : '未完了'}">状態</td>
                    <td th:if="${!trash}"><a class="link" th:href="@{/todos/{id}/edit(id=${todo.id})}">編集</a> <a class="link" th:href="@{/todos/{id}/delete(id=${todo.id})}">削除</a></td>
                    <td th:if="${trash}"><form th:action="@{/todos/{id}/restore(id=${todo.id})}" method="post"><button class="btn sub" type="submit">戻す</button></form></td>
                </tr>
            </tbody>
        </table>
    </main>
    <script>
        const today = new Date();
        const todayDate = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

        document.querySelectorAll('.todo-table tbody tr').forEach(row => {
            const dueDate = row.dataset.dueDate;
            const completed = row.dataset.completed === 'true';
            if (dueDate && dueDate < todayDate && !completed) {
                row.classList.add('overdue');
            }
        });
    </script>
</body>
</html>
